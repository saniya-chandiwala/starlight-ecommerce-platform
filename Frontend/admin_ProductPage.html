<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management | Starlight Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body class="admin-body">
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="sidebar-top">
                <div class="sidebar-header">
                    <a href="admin_Dashboard.html" class="admin-brand">
                        STARLIGHT <span>✦ ADMIN</span>
                    </a>
                </div>
                <nav class="sidebar-nav">
                    <a href="index.html" class="sidebar-link sidebar-storefront-link"
                        title="Open Storefront">Storefront</a>
                    <div class="sidebar-nav-divider"></div>
                    <a href="admin_Dashboard.html" class="sidebar-link">Dashboard</a>
                    <a href="admin_ProductPage.html" class="sidebar-link active">Products</a>
                    <a href="admin_UsersPage.html" class="sidebar-link">Users</a>
                    <a href="admin_OrdersPage.html" class="sidebar-link">Orders</a>
                </nav>
            </div>
            <div class="sidebar-footer">
                <div class="sidebar-user-box">
                    <div class="user-profile-row">
                        <div class="user-avatar">
                            <i class="fa-regular fa-circle-user"></i>
                        </div>
                        <div class="user-details">
                            <span class="user-email-text" id="adminEmail">Loading...</span>
                            <span class="user-badge">✦ Administrator</span>
                        </div>
                    </div>
                    <a href="#" class="sidebar-logout-btn" title="Sign out of Admin Portal" onclick="logoutUser()">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
                    </a>
                </div>
            </div>
        </aside>

        <main class="admin-main">
            <div class="admin-title-area">
                <h1>Product Management</h1>
                <p>Filter by collection to load items on demand, adjust inventory, or register new pieces.</p>
            </div>

            <section class="admin-card selector-card">
                <div class="selector-grid">
                    <div class="form-group">
                        <label for="selectCategory">1. Select Collection</label>
                        <select id="selectCategory" class="admin-select">
                            <option value="" disabled selected hidden>Choose Category</option>
                            <option value="all">All Categories</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="productSearch">2. Select Product</label>
                        <div class="product-search">
                            <i class="fa-solid fa-magnifying-glass search-icon"></i>
                            <input type="text" id="productSearch" class="admin-input search-input"
                                placeholder="Select a category first..." autocomplete="off" disabled>
                            <div id="productDropdown" class="product-dropdown"></div>
                        </div>
                    </div>
                    <div class="selector-action">
                        <label>&nbsp;</label>
                        <button type="button" id="btnAddNew" class="admin-btn btn-secondary">
                            <i class="fa-solid fa-plus"></i> New Product
                        </button>
                    </div>
                </div>
            </section>

            <section class="admin-card form-card">
                <div class="card-header">
                    <h2>Product Details</h2>
                </div>
                <form id="productForm" autocomplete="off">
                    <div class="form-layout">
                        <div class="form-fields">
                            <input type="hidden" id="productId" value="">

                            <div class="form-group full-width">
                                <label for="productName">Product Title</label>
                                <input type="text" id="productName" class="admin-input"
                                    placeholder="e.g. Diamond Necklace" required disabled>
                            </div>

                            <div class="form-row-3">
                                <div class="form-group">
                                    <label for="productCategory">Category</label>
                                    <select id="productCategory" class="admin-select" required disabled>
                                        <option value="" disabled selected hidden>
                                            Select a category
                                        </option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="productPrice">Price (₹)</label>
                                    <input type="number" id="productPrice" class="admin-input" placeholder="0.00"
                                        step="100" required disabled>
                                </div>
                                <div class="form-group">
                                    <label for="productStock">Available Stock</label>
                                    <input type="number" id="productStock" class="admin-input" placeholder="0" required
                                        disabled>
                                </div>
                            </div>

                            <div class="form-group full-width">
                                <label for="productImage">Image File Path</label>
                                <input type="text" id="productImage" class="admin-input"
                                    placeholder="e.g. images/necklaces/neck1.avif" required disabled>
                            </div>

                            <div class="form-group full-width">
                                <label for="productDesc">Description</label>
                                <textarea id="productDesc" rows="4" class="admin-textarea"
                                    placeholder="About the product..." required disabled></textarea>
                            </div>
                        </div>

                        <div class="form-preview">
                            <label>Asset Preview</label>
                            <div class="preview-box" id="previewContainer">
                                <i class="fa-regular fa-image placeholder-icon"></i>
                                <img id="productPreviewImg" src="" alt="Selected Product Preview"
                                    style="display: none;">
                            </div>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" id="btnSave" class="admin-btn btn-primary" disabled>
                            <i class="fa-solid fa-check"></i> Save New
                        </button>
                        <button type="button" id="btnUpdate" class="admin-btn btn-accent" disabled>
                            <i class="fa-solid fa-pen-to-square"></i> Update Piece
                        </button>
                        <button type="button" id="btnDelete" class="admin-btn btn-danger" disabled>
                            <i class="fa-solid fa-trash-can"></i> Delete
                        </button>
                        <button type="button" id="btnClear" class="admin-btn btn-outline">
                            <i class="fa-solid fa-rotate-left"></i> Reset
                        </button>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <script src="js/jquery-3.6.0.js"></script>
    <script src="js/admin_Dashboard.js"></script>
    <script src="js/admin_ProductPage.js"></script>


</body>

</html>
